name: Django CI/CD

on:
  push:
   branches:
    - main

  pull_request:
   branches:
    - main

  permissions:
   contents: read
   packages: write

  jobs:

    test:

      runs-on: ubuntu-latest

      steps:

       - name: Checkout source
         uses: actions/checkout@v4

       - name: Setup Python
         uses: actions/setup-python@v5
         with:
          python-version: "3.12"

       - name: Install dependencies
         run: |
          pip install -r requirements.txt

       - name: Django checks
         run: |
          python manage.py check 

       - name: Run tests
         run: |
          python manage.py test

    build-and-push:

      needs: test

      runs-on: ubuntu-latest

      steps:

        - name: Checkout source
          uses: actions/checkout@v4

        - name: Login to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build Docker image
          run: |
            docker build \
            -t ghcr.io/${{ github.repository_owner }}/django-jfrog-demo:${{ github.sha }} .

        - name: Push Docker image
          run: |
            docker push \
            ghcr.io/${{ github.repository_owner }}/django-jfrog-demo:${{ github.sha }}


